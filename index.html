    function Catalog({ type, navigate }) {
      const [priceRange, setPriceRange] = useState('all');
      const [cpuFilter, setCpuFilter] = useState('all');
      const [gpuFilter, setGpuFilter] = useState('all');
      const [sort, setSort] = useState('price-asc');
      const [compareIds, setCompareIds] = useState([]);
      const [mobileFilters, setMobileFilters] = useState(false);

      const filtered = useMemo(() => {
        let list = products.filter(p => {
          if (type === 'desktop' && p.type !== 'desktop') return false;
          if (type === 'laptop' && p.type !== 'laptop') return false;
          if (priceRange === 'do-10000' && p.price > 10000) return false;
          if (priceRange === '10000-20000' && (p.price < 10000 || p.price > 20000)) return false;
          if (priceRange === '20000-30000' && (p.price < 20000 || p.price > 30000)) return false;
          if (priceRange === 'nad-30000' && p.price <= 30000) return false;
          if (cpuFilter === 'amd' && !p.cpu.toLowerCase().includes('amd') && !p.cpu.toLowerCase().includes('ryzen')) return false;
          if (cpuFilter === 'intel' && !p.cpu.toLowerCase().includes('intel')) return false;
          if (gpuFilter === 'nvidia' && !p.gpu.toLowerCase().includes('nvidia') && !p.gpu.toLowerCase().includes('rtx') && !p.gpu.toLowerCase().includes('gtx')) return false;
          if (gpuFilter === 'amd' && !p.gpu.toLowerCase().includes('radeon') && !p.gpu.toLowerCase().includes('rx ')) return false;
          return true;
        });
        list = [...list].sort((a, b) => {
          if (sort === 'price-asc') return a.price - b.price;
          if (sort === 'price-desc') return b.price - a.price;
          if (sort === 'rating') return b.rating - a.rating;
          return 0;
        });
        return list;
      }, [type, priceRange, cpuFilter, gpuFilter, sort]);

      const toggleCompare = (id) => {
        setCompareIds(prev => {
          if (prev.includes(id)) return prev.filter(x => x !== id);
          if (prev.length >= 2) return [prev[1], id];
          return [...prev, id];
        });
      };

      const title = type === 'desktop' ? 'Herní PC' : type === 'laptop' ? 'Herní notebooky' : 'Katalog počítačů';

      const Filters = () => (
        <div className="space-y-5">
          <div>
            <label className="block text-sm font-medium mb-2">Cena</label>
            <select value={priceRange} onChange={e => setPriceRange(e.target.value)} className="input-field">
              <option value="all">Všechny ceny</option>
              <option value="do-10000">Do 10 000 Kč</option>
              <option value="10000-20000">10 000 – 20 000 Kč</option>
              <option value="20000-30000">20 000 – 30 000 Kč</option>
              <option value="nad-30000">Nad 30 000 Kč</option>
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium mb-2">Procesor</label>
            <select value={cpuFilter} onChange={e => setCpuFilter(e.target.value)} className="input-field">
              <option value="all">Všechny</option>
              <option value="amd">AMD Ryzen</option>
              <option value="intel">Intel</option>
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium mb-2">Grafická karta</label>
            <select value={gpuFilter} onChange={e => setGpuFilter(e.target.value)} className="input-field">
              <option value="all">Všechny</option>
              <option value="nvidia">NVIDIA</option>
              <option value="amd">AMD Radeon</option>
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium mb-2">Řazení</label>
            <select value={sort} onChange={e => setSort(e.target.value)} className="input-field">
              <option value="price-asc">Cena: od nejnižší</option>
              <option value="price-desc">Cena: od nejvyšší</option>
              <option value="rating">Hodnocení</option>
            </select>
          </div>
        </div>
      );

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10">
          <div className="flex items-center justify-between mb-8">
            <div>
              <h1 className="section-title mb-1">{title}</h1>
              <p className="text-gray text-sm">{filtered.length} produktů · demonstrační nabídka</p>
            </div>
            <button className="lg:hidden btn-secondary text-sm py-2" onClick={() => setMobileFilters(true)}>
              <Icon name="sliders" size={16} /> Filtry
            </button>
          </div>

          {compareIds.length > 0 && (
            <div className="mb-6 p-4 rounded-xl bg-neon/10 border border-neon/30 flex flex-wrap items-center justify-between gap-3">
              <span className="text-sm">Vybráno k porovnání: <strong>{compareIds.length}/2</strong></span>
              <div className="flex gap-2">
                {compareIds.length === 2 && (
                  <button onClick={() => navigate('compare', null, { a: compareIds[0], b: compareIds[1] })} className="btn-primary text-sm py-2">Porovnat</button>
                )}
                <button onClick={() => setCompareIds([])} className="btn-secondary text-sm py-2">Zrušit</button>
              </div>
            </div>
          )}

          <div className="grid lg:grid-cols-4 gap-8">
            <aside className="hidden lg:block">
              <div className="card p-5 sticky top-24">
                <h2 className="font-semibold mb-4">Filtry</h2>
                <Filters />
              </div>
            </aside>
            <div className="lg:col-span-3">
              {filtered.length === 0 ? (
                <div className="card p-12 text-center text-gray">Žádné produkty neodpovídají filtrům.</div>
              ) : (
                <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-6">
                  {filtered.map(p => (
                    <ProductCard key={p.id} product={p} onOpen={id => navigate('product', id)} onCompareToggle={toggleCompare} isCompared={compareIds.includes(p.id)} />
                  ))}
                </div>
              )}
            </div>
          </div>

          {mobileFilters && (
            <div className="fixed inset-0 z-50 lg:hidden">
              <div className="absolute inset-0 bg-black/60" onClick={() => setMobileFilters(false)} />
              <div className="absolute right-0 top-0 bottom-0 w-80 max-w-full bg-dark-blue p-6 overflow-y-auto">
                <div className="flex items-center justify-between mb-6">
                  <h2 className="font-semibold text-lg">Filtry</h2>
                  <button onClick={() => setMobileFilters(false)} className="p-2 text-gray hover:text-white"><Icon name="x" size={20} /></button>
                </div>
                <Filters />
              </div>
            </div>
          )}
        </div>
      );
    }

    function ProductDetail({ id, navigate }) {

              {product.used && <span className="absolute top-4 left-4 bg-amber-500 text-dark text-xs font-bold px-3 py-1.5 rounded-lg">POUŽITÉ</span>}
            </div>
            <div>
              <div className="flex items-center gap-3 mb-2">

              <div className="grid grid-cols-2 gap-3 mb-8">
                {[

              <div className="flex flex-wrap gap-3 mb-4">

                <button onClick={() => navigate('compare', null, { a: product.id })} className="btn-secondary">Porovnat</button>
              </div>
              <p className="text-xs text-gray">Tlačítko je připraveno pro affiliate odkaz. Aktuálně demonstrační.</p>

          {fpsEntries.length > 0 && (
            <section className="mt-14">
              <h2 className="text-2xl font-bold mb-6">Orientační FPS (1080p)</h2>

                <table className="w-full text-sm">
                  <thead><tr className="border-b border-white/10 text-left"><th className="px-5 py-3 text-gray font-medium">Hra</th><th className="px-5 py-3 text-gray font-medium">FPS</th></tr></thead>
                  <tbody>
                    {fpsEntries.map(([game, fps]) => (
                      <tr key={game} className="border-b border-white/5 hover:bg-white/5">
                        <td className="px-5 py-3 font-medium">{game}</td>
                        <td className="px-5 py-3"><span className="text-neon font-semibold">{fps}</span> FPS</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p className="text-xs text-gray mt-3">Hodnoty jsou orientační ukázky pro demonstrační účely.</p>
            </section>
          )}
          <div className="mt-10"><AdBanner /></div>
        </div>
      );
    }

    function Wizard({ navigate }) {
      const BUDGETS = [
        { id: 'do-5000', label: 'Do 5 000 Kč', min: 0, max: 5000 },
        { id: '5000-10000', label: '5 000–10 000 Kč', min: 5000, max: 10000 },
        { id: '10000-15000', label: '10 000–15 000 Kč', min: 10000, max: 15000 },
        { id: '15000-20000', label: '15 000–20 000 Kč', min: 15000, max: 20000 },
        { id: '20000-30000', label: '20 000–30 000 Kč', min: 20000, max: 30000 },
        { id: 'nad-30000', label: 'Nad 30 000 Kč', min: 30000, max: 999999 },
      ];
      const TYPES = [
        { id: 'desktop', label: 'Stolní počítač' },
        { id: 'laptop', label: 'Herní notebook' },
        { id: 'used', label: 'Použitý počítač' },
      ];
      const GAMES = ['Warzone', 'CS2', 'PUBG', 'Fortnite', 'GTA V', 'Minecraft', 'Kingdom Come: Deliverance II'];
      const PERFORMANCE = [
        { id: 'nizky', label: 'Nízký', desc: 'Lehké hry, nižší nastavení' },
        { id: 'stredni', label: 'Střední', desc: 'Plynulé 1080p' },
        { id: 'vysoky', label: 'Vysoký', desc: 'Vysoké detaily, 1440p' },
        { id: 'maximalni', label: 'Maximální', desc: '4K / max nastavení' },
      ];

      const [step, setStep] = useState(1);
      const [budget, setBudget] = useState(null);
      const [deviceType, setDeviceType] = useState(null);
      const [games, setGames] = useState([]);
      const [performance, setPerformance] = useState(null);
      const [results, setResults] = useState(null);

      const toggleGame = g => setGames(prev => prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g]);
      const canNext = () => {
        if (step === 1) return !!budget;
        if (step === 2) return !!deviceType;
        if (step === 3) return games.length > 0;
        if (step === 4) return !!performance;
        return false;
      };

      const finish = () => {
        const b = BUDGETS.find(x => x.id === budget);
        let list = products.filter(p => {
          if (deviceType === 'desktop' && (p.type !== 'desktop' || p.used)) return false;
          if (deviceType === 'laptop' && p.type !== 'laptop') return false;
          if (deviceType === 'used' && !p.used) return false;
          if (b && (p.price < b.min || p.price > b.max)) return false;
          if (performance) {
            const order = ['nizky', 'stredni', 'vysoky', 'maximalni'];
            if (Math.abs(order.indexOf(p.performance) - order.indexOf(performance)) > 1) return false;
          }
          return true;
        });
        list = list.map(p => {
          let score = 0;
          games.forEach(g => { if (p.fps && p.fps[g]) score += p.fps[g]; });
          return { ...p, score };
        }).sort((a, b) => b.score - a.score || a.price - b.price).slice(0, 6);
        setResults(list);
        setStep(5);
      };

      const Option = ({ selected, onClick, children }) => (
        <button type="button" onClick={onClick} className={`w-full text-left p-4 rounded-xl border transition-all ${selected ? 'border-neon bg-neon/10 shadow-neon' : 'border-white/10 bg-dark-blue/50 hover:border-white/30'}`}>
          <div className="flex items-center gap-3">
            <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${selected ? 'border-neon bg-neon' : 'border-gray'}`}>
              {selected && <Icon name="check" size={12} className="text-dark" />}
            </div>
            <div className="flex-1">{children}</div>
          </div>
        </button>
      );

      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-10">
          <h1 className="section-title mb-2 text-center">Chytrý výběr počítače</h1>
          <p className="text-gray text-center mb-10">Odpověz na pár otázek a my ti doporučíme sestavy</p>
          {step < 5 && (
            <div className="flex gap-2 mb-10">
              {[1, 2, 3, 4].map(s => <div key={s} className={`h-1.5 flex-1 rounded-full transition-colors ${s <= step ? 'bg-neon' : 'bg-white/10'}`} />)}
            </div>
          )}
          {step === 1 && (
            <div className="space-y-3">
              <h2 className="text-xl font-semibold mb-4">Jaký máš rozpočet?</h2>
              {BUDGETS.map(b => <Option key={b.id} selected={budget === b.id} onClick={() => setBudget(b.id)}><span className="font-medium">{b.label}</span></Option>)}
            </div>
          )}
          {step === 2 && (
            <div className="space-y-3">
              <h2 className="text-xl font-semibold mb-4">Jaký typ zařízení hledáš?</h2>
              {TYPES.map(t => <Option key={t.id} selected={deviceType === t.id} onClick={() => setDeviceType(t.id)}><span className="font-medium">{t.label}</span></Option>)}
            </div>
          )}
          {step === 3 && (
            <div className="space-y-3">
              <h2 className="text-xl font-semibold mb-4">Které hry hraješ?</h2>
              <div className="grid sm:grid-cols-2 gap-3">
                {GAMES.map(g => <Option key={g} selected={games.includes(g)} onClick={() => toggleGame(g)}><span className="font-medium">{g}</span></Option>)}
              </div>
            </div>
          )}
          {step === 4 && (
            <div className="space-y-3">
              <h2 className="text-xl font-semibold mb-4">Jaký výkon očekáváš?</h2>
              {PERFORMANCE.map(p => (
                <Option key={p.id} selected={performance === p.id} onClick={() => setPerformance(p.id)}>
                  <span className="font-medium">{p.label}</span>
                  <span className="block text-sm text-gray mt-0.5">{p.desc}</span>
                </Option>
              ))}
            </div>
          )}
          {step === 5 && results && (
            <div>
              <h2 className="text-xl font-semibold mb-2">Doporučené počítače pro tebe</h2>
              <p className="text-gray text-sm mb-6">Na základě tvých odpovědí – demonstrační sestavy.</p>
              {results.length === 0 ? (
                <div className="card p-8 text-center text-gray">
                  Nenašli jsme přesnou shodu. Zkus upravit rozpočet nebo výkon.
                  <div className="mt-4"><button onClick={() => setStep(1)} className="btn-secondary">Spustit znovu</button></div>
                </div>
              ) : (
                <div className="grid sm:grid-cols-2 gap-6">
                  {results.map(p => <ProductCard key={p.id} product={p} onOpen={id => navigate('product', id)} />)}
                </div>
              )}
              <div className="mt-8 text-center">
                <button onClick={() => { setStep(1); setBudget(null); setDeviceType(null); setGames([]); setPerformance(null); setResults(null); }} className="btn-secondary">Spustit průvodce znovu</button>
              </div>
            </div>
          )}
          {step < 5 && (
            <div className="flex justify-between mt-10">
              <button onClick={() => setStep(s => Math.max(1, s - 1))} disabled={step === 1} className="btn-secondary disabled:opacity-40"><Icon name="arrowLeft" size={18} /> Zpět</button>
              {step < 4 ? (
                <button onClick={() => canNext() && setStep(s => s + 1)} disabled={!canNext()} className="btn-primary disabled:opacity-40">Další <Icon name="arrowRight" size={18} /></button>
              ) : (
                <button onClick={() => canNext() && finish()} disabled={!canNext()} className="btn-primary disabled:opacity-40">Zobrazit doporučení</button>
              )}
            </div>
          )}
        </div>
      );
    }

    function Compare({ params, navigate }) {
      const [idA, setIdA] = useState(params?.a ? String(params.a) : '');
      const [idB, setIdB] = useState(params?.b ? String(params.b) : '');
      const productA = idA ? products.find(p => p.id === Number(idA)) : null;
      const productB = idB ? products.find(p => p.id === Number(idB)) : null;
      const rows = [
        { label: 'Název', key: 'name' },
        { label: 'Cena', key: 'price', format: v => `${Number(v).toLocaleString('cs-CZ')} Kč` },
        { label: 'Procesor', key: 'cpu' },
        { label: 'Grafická karta', key: 'gpu' },
        { label: 'RAM', key: 'ram' },
        { label: 'SSD', key: 'ssd' },
        { label: 'Hodnocení', key: 'rating', format: v => `${v} / 5` },
        { label: 'Typ', key: 'type', format: v => v === 'laptop' ? 'Notebook' : 'Stolní PC' },
      ];
      const allGames = useMemo(() => {
        const set = new Set();
        if (productA?.fps) Object.keys(productA.fps).forEach(g => set.add(g));
        if (productB?.fps) Object.keys(productB.fps).forEach(g => set.add(g));
        return Array.from(set);
      }, [productA, productB]);

      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10">
          <h1 className="section-title mb-2">Porovnání počítačů</h1>
          <p className="text-gray mb-8">Vyber dva produkty a porovnej specifikace i herní výkon.</p>
          <div className="grid sm:grid-cols-2 gap-4 mb-10">
            <div>
              <label className="block text-sm font-medium mb-2">Počítač A</label>
              <select value={idA} onChange={e => setIdA(e.target.value)} className="input-field">
                <option value="">— Vyber produkt —</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name} ({p.price.toLocaleString('cs-CZ')} Kč)</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium mb-2">Počítač B</label>
              <select value={idB} onChange={e => setIdB(e.target.value)} className="input-field">
                <option value="">— Vyber produkt —</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name} ({p.price.toLocaleString('cs-CZ')} Kč)</option>)}
              </select>
            </div>
          </div>
          {productA && productB ? (
            <div className="card overflow-hidden">
              <div className="grid grid-cols-3 border-b border-white/10">
                <div className="p-4 text-gray text-sm font-medium">Parametr</div>
                <div className="p-4 text-center border-l border-white/10">
                  <img src={productA.image} alt="" className="w-full h-28 object-cover rounded-lg mb-2" />
                  <p className="font-semibold text-sm">{productA.name}</p>
                </div>
                <div className="p-4 text-center border-l border-white/10">
                  <img src={productB.image} alt="" className="w-full h-28 object-cover rounded-lg mb-2" />
                  <p className="font-semibold text-sm">{productB.name}</p>
                </div>
              </div>
              {rows.map(row => (
                <div key={row.key} className="grid grid-cols-3 border-b border-white/5 hover:bg-white/[0.02]">
                  <div className="p-4 text-sm text-gray">{row.label}</div>
                  <div className="p-4 text-sm text-center border-l border-white/5 font-medium">{row.format ? row.format(productA[row.key]) : productA[row.key]}</div>
                  <div className="p-4 text-sm text-center border-l border-white/5 font-medium">{row.format ? row.format(productB[row.key]) : productB[row.key]}</div>
                </div>
              ))}
              {allGames.length > 0 && (
                <>
                  <div className="grid grid-cols-3 bg-neon/5 border-b border-white/10">
                    <div className="p-4 text-sm font-semibold text-neon col-span-3 flex items-center gap-2"><Icon name="compare" size={16} /> Herní výkon (orientační FPS)</div>
                  </div>
                  {allGames.map(game => (
                    <div key={game} className="grid grid-cols-3 border-b border-white/5 hover:bg-white/[0.02]">
                      <div className="p-4 text-sm text-gray">{game}</div>
                      <div className="p-4 text-sm text-center border-l border-white/5">{productA.fps?.[game] ? <span className="text-neon font-semibold">{productA.fps[game]} FPS</span> : '—'}</div>
                      <div className="p-4 text-sm text-center border-l border-white/5">{productB.fps?.[game] ? <span className="text-neon font-semibold">{productB.fps[game]} FPS</span> : '—'}</div>
                    </div>
                  ))}
                </>
              )}
              <div className="grid grid-cols-3">
                <div className="p-4" />
                <div className="p-4 border-l border-white/5 text-center"><button onClick={() => navigate('product', productA.id)} className="btn-primary text-sm py-2">Detail A</button></div>
                <div className="p-4 border-l border-white/5 text-center"><button onClick={() => navigate('product', productB.id)} className="btn-primary text-sm py-2">Detail B</button></div>
              </div>
            </div>
          ) : (
            <div className="card p-12 text-center text-gray">
              <div className="mx-auto mb-4 text-neon opacity-50 flex justify-center"><Icon name="compare" size={40} /></div>
              <p>Vyber dva počítače výše pro zobrazení porovnání.</p>
            </div>
          )}
        </div>
      );
    }

    function Poradna({ navigate }) {
      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10">
          <h1 className="section-title mb-2">Herní poradna</h1>
          <p className="text-gray mb-10 max-w-2xl">Užitečné články pro začátečníky i pokročilé.</p>
          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            {articles.map(a => (
              <button key={a.slug} onClick={() => navigate('article', a.slug)} className="card p-6 text-left group hover:border-neon/40 transition-all">
                <div className="flex items-center gap-2 text-xs text-neon mb-3">
                  <Icon name="book" size={14} /><span>{a.category}</span>
                  <span className="text-gray">·</span>
                  <Icon name="clock" size={14} className="text-gray" /><span className="text-gray">{a.readTime}</span>
                </div>
                <h2 className="font-semibold text-lg mb-2 group-hover:text-neon transition-colors">{a.title}</h2>
                <p className="text-sm text-gray leading-relaxed">{a.excerpt}</p>
              </button>
            ))}
          </div>
          <AdBanner />
        </div>
      );
    }

    function ArticleDetail({ slug, navigate }) {
      const article = articles.find(a => a.slug === slug);
      if (!article) {
        return (
          <div className="max-w-3xl mx-auto px-4 py-20 text-center">
            <h1 className="text-2xl font-bold mb-4">Článek nenalezen</h1>
            <button onClick={() => navigate('poradna')} className="btn-primary">Zpět do poradny</button>
          </div>
        );
      }
      return (
        <article className="max-w-3xl mx-auto px-4 sm:px-6 py-10">
          <button onClick={() => navigate('poradna')} className="inline-flex items-center gap-2 text-gray hover:text-neon text-sm mb-8 transition-colors">
            <Icon name="arrowLeft" size={16} /> Zpět do poradny
          </button>
          <div className="flex items-center gap-2 text-sm text-neon mb-4">
            <Icon name="book" size={16} /><span>{article.category}</span>
            <span className="text-gray">·</span>
            <Icon name="clock" size={16} className="text-gray" /><span className="text-gray">{article.readTime}</span>
          </div>
          <h1 className="text-3xl md:text-4xl font-bold mb-6 leading-tight">{article.title}</h1>
          <div className="space-y-4 text-gray leading-relaxed [&_h3]:text-white [&_h3]:font-semibold [&_h3]:text-xl [&_h3]:mt-8 [&_h3]:mb-3 [&_p]:mb-4 [&_ul]:list-disc [&_ul]:pl-5 [&_ul]:space-y-2 [&_strong]:text-white"
            dangerouslySetInnerHTML={{ __html: article.content }} />
          <div className="mt-12 pt-8 border-t border-white/10">
            <p className="text-sm text-gray mb-4">Chceš doporučit konkrétní sestavu?</p>
            <div className="flex flex-wrap gap-3">
              <button onClick={() => navigate('wizard')} className="btn-primary">Spustit průvodce</button>
              <button onClick={() => navigate('ai')} className="btn-secondary">AI poradce</button>
            </div>
          </div>
        </article>
      );
    }

    function AiAdvisor({ navigate }) {
      const demoRecommend = (message) => {
        const text = message.toLowerCase();
        let list = [...products];
        const budgetMatch = text.match(/(\d{4,6})\s*(kč|kc|czk)?/);
        if (budgetMatch) list = list.filter(p => p.price <= parseInt(budgetMatch[1], 10) * 1.1);
        else if (text.includes('levn') || text.includes('budget') || text.includes('do 10')) list = list.filter(p => p.price <= 15000);
        else if (text.includes('drah') || text.includes('high') || text.includes('nejlep')) list = list.filter(p => p.price >= 25000);
        if (text.includes('notebook') || text.includes('laptop')) list = list.filter(p => p.type === 'laptop');
        else if (text.includes('stoln') || text.includes('desktop') || text.includes(' pc')) list = list.filter(p => p.type === 'desktop');
        if (text.includes('použit') || text.includes('bazar')) list = list.filter(p => p.used);
        const gameKeywords = { warzone: 'Warzone', cs2: 'CS2', 'counter-strike': 'CS2', pubg: 'PUBG', fortnite: 'Fortnite', gta: 'GTA V', minecraft: 'Minecraft', 'kingdom come': 'Kingdom Come: Deliverance II', kcd: 'Kingdom Come: Deliverance II' };
        let preferredGame = null;
        for (const [kw, game] of Object.entries(gameKeywords)) { if (text.includes(kw)) { preferredGame = game; break; } }
        if (preferredGame) list = list.map(p => ({ ...p, score: p.fps?.[preferredGame] || 0 })).sort((a, b) => b.score - a.score);
        else list.sort((a, b) => a.price - b.price);
        const top = list.slice(0, 3);
        if (top.length === 0) return { reply: 'Podle zadaných kritérií jsem nenašel vhodnou sestavu. Zkus upravit rozpočet nebo typ zařízení.', products: [] };
        return { reply: `Na základě tvé zprávy doporučuji: ${top.map(p => p.name).join(', ')}. (Ukázkový doporučovací systém, ne skutečná AI.)`, products: top };
      };

      const [input, setInput] = useState('');
      const [messages, setMessages] = useState([{ role: 'bot', text: 'Ahoj! Jsem demonstrační herní poradce. Napiš např.: „Mám rozpočet 15 000 Kč a chci hrát Warzone.“' }]);
      const [suggestions, setSuggestions] = useState([]);

      const send = () => {
        const text = input.trim();
        if (!text) return;
        setMessages(m => [...m, { role: 'user', text }]);
        setInput('');
        const result = demoRecommend(text);
        setTimeout(() => {
          setMessages(m => [...m, { role: 'bot', text: result.reply }]);
          setSuggestions(result.products);
        }, 400);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-10">
          <div className="text-center mb-8">
            <h1 className="section-title mb-2">AI Herní poradce</h1>
            <p className="text-amber-400/90 text-sm bg-amber-400/10 border border-amber-400/30 rounded-xl px-4 py-2 inline-block">Demonstrační systém – není připojen skutečný AI model</p>
          </div>
          <div className="card flex flex-col h-[480px]">
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg, i) => (
                <div key={i} className={`flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                  <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ${msg.role === 'bot' ? 'bg-neon/20 text-neon' : 'bg-blue/20 text-blue'}`}>
                    <Icon name={msg.role === 'bot' ? 'bot' : 'user'} size={16} />
                  </div>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${msg.role === 'bot' ? 'bg-dark-blue border border-white/5' : 'bg-blue/20 border border-blue/30'}`}>{msg.text}</div>
                </div>
              ))}
            </div>
            <div className="p-4 border-t border-white/5">
              <div className="flex gap-2">
                <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Napiš svůj rozpočet a hry…" className="input-field flex-1" />
                <button onClick={send} className="btn-primary px-4" aria-label="Odeslat"><Icon name="send" size={18} /></button>
              </div>
              <div className="flex flex-wrap gap-2 mt-3">
                {['Mám rozpočet 15 000 Kč a chci hrát Warzone', 'Hledám herní notebook do 25 000 Kč', 'Chci hrát CS2 na vysoké FPS'].map(s => (
                  <button key={s} onClick={() => setInput(s)} className="text-xs px-3 py-1.5 rounded-full border border-white/10 text-gray hover:border-neon hover:text-neon transition-colors">{s}</button>
                ))}
              </div>
            </div>
          </div>
          {suggestions.length > 0 && (
            <div className="mt-10">
              <h2 className="text-xl font-semibold mb-4">Doporučené sestavy</h2>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {suggestions.map(p => <ProductCard key={p.id} product={p} onOpen={id => navigate('product', id)} />)}
              </div>
            </div>
          )}
        </div>
      );
    }

    function About({ navigate }) {
      return (
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-10">
          <h1 className="section-title mb-6">O nás</h1>
          <div className="space-y-6 text-gray leading-relaxed">
            <p className="text-lg text-white"><strong>HERNÍ PORADCE</strong> je česká webová platforma, která pomáhá lidem vybrat ideální herní počítač nebo notebook – i když počítačům vůbec nerozumí.</p>
            <p>Stačí zadat rozpočet, oblíbené hry a požadovaný výkon. My doporučíme sestavy, které dávají smysl.</p>
            <div className="grid sm:grid-cols-3 gap-4 my-10">
              {[
                { icon: 'target', title: 'Jednoduchost', text: 'Průvodce krok za krokem bez technického žargonu.' },
                { icon: 'users', title: 'Pro každého', text: 'Od prvního PC po high-end sestavu.' },
                { icon: 'trend', title: 'Růst', text: 'Připraveno na affiliate, reklamy a další rozvoj.' },
              ].map(f => (
                <div key={f.title} className="card p-5 text-center">
                  <div className="mx-auto text-neon mb-3 flex justify-center"><Icon name={f.icon} size={28} /></div>
                  <h3 className="font-semibold text-white mb-1">{f.title}</h3>
                  <p className="text-sm">{f.text}</p>
                </div>
              ))}
            </div>
            <h2 className="text-xl font-semibold text-white">Monetizace</h2>
            <p>Web je připravený na affiliate odkazy do e-shopů, reklamní plochy a doporučené partnerské nabídky. Všechny produkty jsou demonstrační.</p>
            <div className="card p-6 mt-8 bg-gradient-to-r from-blue/10 to-neon/10 border-neon/20">
              <p className="text-white font-medium mb-3">Chceš hned vybrat počítač?</p>
              <div className="flex flex-wrap gap-3">
                <button onClick={() => navigate('wizard')} className="btn-primary">Spustit průvodce</button>
                <button onClick={() => navigate('catalog')} className="btn-secondary">Prohlédnout katalog</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== APP ==========
    function App() {
      const [page, setPage] = useState('home');
      const [pageId, setPageId] = useState(null);
      const [pageParams, setPageParams] = useState(null);
      const [menuOpen, setMenuOpen] = useState(false);

      const navigate = (p, id = null, params = null) => {
        setPage(p);
        setPageId(id);
        setPageParams(params);
        setMenuOpen(false);
        window.scrollTo(0, 0);
      };

      const navClick = (id) => {
        if (id === 'desktop') navigate('desktop');
        else if (id === 'laptop') navigate('laptop');
        else navigate(id === 'home' ? 'home' : id);
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-50 bg-dark/90 backdrop-blur-md border-b border-white/5">
            <div className="max-w-7xl mx-auto px-4 sm:px-6">
              <div className="flex items-center justify-between h-16">
                <button onClick={() => navigate('home')} className="flex items-center gap-2 group">
                  <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blue to-neon flex items-center justify-center shadow-neon">
                    <Icon name="gamepad" size={20} className="text-dark" />
                  </div>
                  <span className="font-bold text-lg tracking-tight group-hover:text-neon transition-colors">HERNÍ PORADCE</span>
                </button>
                <nav className="hidden lg:flex items-center gap-1">
                  {NAV.map(l => (
                    <button key={l.id} onClick={() => navClick(l.id)}
                      className={`px-3 py-2 rounded-lg text-sm font-medium transition-colors ${
                        (page === l.id || (l.id === 'desktop' && page === 'desktop') || (l.id === 'laptop' && page === 'laptop') || (l.id === 'home' && page === 'home'))
                          ? 'text-neon bg-neon/10' : 'text-gray hover:text-white hover:bg-white/5'
                      }`}>
                      {l.label}
                    </button>
                  ))}
                </nav>
                <button className="lg:hidden p-2 text-gray hover:text-white" onClick={() => setMenuOpen(!menuOpen)}>
                  <Icon name={menuOpen ? 'x' : 'menu'} size={24} />
                </button>
              </div>
              {menuOpen && (
                <nav className="lg:hidden pb-4 space-y-1">
                  {NAV.map(l => (
                    <button key={l.id} onClick={() => navClick(l.id)} className="block w-full text-left px-4 py-3 rounded-xl text-sm font-medium text-gray hover:text-white hover:bg-white/5">
                      {l.label}
                    </button>
                  ))}
                </nav>
              )}
            </div>
          </header>

          <main className="flex-1">
            {page === 'home' && <Home navigate={navigate} />}
            {page === 'catalog' && <Catalog navigate={navigate} />}
            {page === 'desktop' && <Catalog type="desktop" navigate={navigate} />}
            {page === 'laptop' && <Catalog type="laptop" navigate={navigate} />}
            {page === 'product' && <ProductDetail id={pageId} navigate={navigate} />}
            {page === 'wizard' && <Wizard navigate={navigate} />}
            {page === 'compare' && <Compare params={pageParams} navigate={navigate} />}
            {page === 'poradna' && <Poradna navigate={navigate} />}
            {page === 'article' && <ArticleDetail slug={pageId} navigate={navigate} />}
            {page === 'ai' && <AiAdvisor navigate={navigate} />}
            {page === 'about' && <About navigate={navigate} />}
          </main>

          <footer className="border-t border-white/5 bg-dark-blue/50 mt-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-12">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div>
                  <div className="flex items-center gap-2 mb-4">
                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue to-neon flex items-center justify-center">
                      <Icon name="gamepad" size={16} className="text-dark" />
                    </div>
                    <span className="font-bold">HERNÍ PORADCE</span>
                  </div>
                  <p className="text-gray text-sm leading-relaxed">Česká platforma pro výběr ideálního herního počítače podle rozpočtu a her.</p>
                </div>
                <div>
                  <h4 className="font-semibold mb-3">Navigace</h4>
                  <ul className="space-y-2 text-sm text-gray">
                    <li><button onClick={() => navigate('desktop')} className="hover:text-neon">Herní PC</button></li>
                    <li><button onClick={() => navigate('laptop')} className="hover:text-neon">Herní notebooky</button></li>
                    <li><button onClick={() => navigate('wizard')} className="hover:text-neon">Chytrý výběr</button></li>
                    <li><button onClick={() => navigate('compare')} className="hover:text-neon">Porovnání</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="font-semibold mb-3">Poradna</h4>
                  <ul className="space-y-2 text-sm text-gray">
                    <li><button onClick={() => navigate('poradna')} className="hover:text-neon">Články</button></li>
                    <li><button onClick={() => navigate('ai')} className="hover:text-neon">AI Poradce</button></li>
                    <li><button onClick={() => navigate('about')} className="hover:text-neon">O nás</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="font-semibold mb-3">Monetizace</h4>
                  <p className="text-sm text-gray mb-3">Připraveno na affiliate a reklamy.</p>
                  <div className="bg-dark/50 border border-dashed border-white/10 rounded-xl p-4 text-center text-xs text-gray">Reklamní plocha</div>
                </div>
              </div>
              <div className="mt-10 pt-6 border-t border-white/5 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray">
                <p>© {new Date().getFullYear()} Herní Poradce. Demonstrační projekt.</p>
                <p className="text-xs">Všechny produkty jsou ukázkové.</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
